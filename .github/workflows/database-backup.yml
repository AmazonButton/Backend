name: Automated Database Backup (Zero Cost)

on:
  schedule:
    # Runs daily at 02:00 UTC (09:00 AM VN Time)
    - cron: '0 2 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions UI

jobs:
  backup:
    name: Dump and Secure Database
    runs-on: ubuntu-latest
    steps:
      - name: Install PostgreSQL Client Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Perform Logical Database Backup (pg_dump)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_UNPOOLED || secrets.DATABASE_URL }}
        run: |
          BACKUP_DATE=$(date +'%Y-%m-%d_%H%M%S')
          BACKUP_FILE="smart_order_backup_${BACKUP_DATE}.sql.gz"
          echo "Starting backup at $(date)..."
          
          # Dump complete schema and data with clean DROP TABLE IF EXISTS statements
          pg_dump "$DATABASE_URL" \
            --no-owner \
            --no-privileges \
            --clean \
            --if-exists \
            --format=plain | gzip -9 > "$BACKUP_FILE"
            
          echo "BACKUP_FILE=$BACKUP_FILE" >> $GITHUB_ENV
          echo "Backup file created: $BACKUP_FILE ($(du -h $BACKUP_FILE | cut -f1))"

      - name: Encrypt Database Dump with OpenSSL AES-256-CBC
        env:
          BACKUP_KEY: ${{ secrets.BACKUP_ENCRYPTION_PASSPHRASE || secrets.JWT_SECRET || 'smart-order-secure-backup-passphrase' }}
        run: |
          ENCRYPTED_FILE="${BACKUP_FILE}.enc"
          openssl enc -aes-256-cbc -salt -pbkdf2 -iter 100000 -in "$BACKUP_FILE" -out "$ENCRYPTED_FILE" -pass "pass:$BACKUP_KEY"
          rm -f "$BACKUP_FILE"
          echo "ENCRYPTED_FILE=$ENCRYPTED_FILE" >> $GITHUB_ENV
          echo "Encrypted backup ready: $ENCRYPTED_FILE ($(du -h $ENCRYPTED_FILE | cut -f1))"

      - name: Upload Encrypted Backup to GitHub Artifacts (14-day retention)
        uses: actions/upload-artifact@v4
        with:
          name: database-daily-backup
          path: ${{ env.ENCRYPTED_FILE }}
          retention-days: 14

